name: repro-8296

on:
  push:
    branches: ['ci/repro-8296-*']

permissions:
  contents: read

jobs:
  native-then-cross:
    if: github.repository != 'dsx-ai-factory/infra-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # ci/repro-8296-base expects the reported failure; ci/repro-8296-fix expects success.
      EXPECT: ${{ endsWith(github.ref_name, '-base') && 'glibc-failure' || 'success' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libudev-dev libssl-dev libtss2-dev libclang-dev cmake pkg-config jq file
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - name: Record versions
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "host glibc: $(ldd --version | head -1)"
          rustc --version
          echo "container glibc: $(docker run --rm rust:1.97.1-bookworm ldd --version | head -1)"
      - name: Native Scout release build (host glibc)
        run: |
          export CARGO_HOME="$HOME/.cargo"
          cargo make package-scout-x86_64-release-local
          ls target/release/build | head -5
      - name: ARM Scout cross packaging (reported images-all path)
        run: |
          export CARGO_HOME="$HOME/.cargo"
          set +e
          cargo make package-scout-aarch64-release-cross 2>&1 | tee cross.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit code: $rc"
          if grep -q "GLIBC_2.39' not found" cross.log; then glibc=yes; else glibc=no; fi
          echo "GLIBC_2.39 error seen: $glibc"
          if [ "$EXPECT" = glibc-failure ]; then
            [ "$rc" -ne 0 ] && [ "$glibc" = yes ] || { echo "::error::baseline did not fail with the reported glibc error"; exit 1; }
            echo "Baseline reproduced the reported failure."
          else
            [ "$rc" -eq 0 ] && [ "$glibc" = no ] || { echo "::error::fixed build failed"; exit 1; }
          fi
      - name: Check ARM binaries and package
        if: env.EXPECT == 'success'
        run: |
          file target/aarch64-unknown-linux-gnu/release/forge-scout target/aarch64-unknown-linux-gnu/release/mlx-firmware-supervisor | tee file.log
          [ "$(grep -c 'ARM aarch64' file.log)" -eq 2 ]
          ls target/debs/
          deb=$(ls target/debs/*_arm64.deb)
          dpkg-deb -I "$deb" | grep -E 'Package|Architecture'
          dpkg-deb -c "$deb"
          dpkg-deb -c "$deb" | grep -q 'opt/forge/forge-scout$'
          dpkg-deb -c "$deb" | grep -q 'opt/forge/mlx-firmware-supervisor$'
          du -sh target/cross-aarch64-build target/release
      - name: Other changed cross tasks (CLI and BlueField FMDS)
        if: env.EXPECT == 'success'
        run: |
          export CARGO_HOME="$HOME/.cargo"
          cargo make build-cli-cross-aarch64
          file target/aarch64-unknown-linux-gnu/release/nico-admin-cli | grep 'ARM aarch64'
          (cd bluefield && cargo make build-fmds)
          file target/aarch64-unknown-linux-gnu/release/carbide-fmds | grep 'ARM aarch64'
      - name: Disk usage
        if: always()
        run: df -h /
