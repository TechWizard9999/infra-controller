name: verify-credential-docs
on:
  push:
    branches: ['ci/8874-docs-20261111']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install documentation tools
        run: |
          pipx install rumdl
          npm install -g fern-api@$(node -e "console.log(require('./fern/fern.config.json').version)")
      - name: Check changed Markdown
        run: rumdl check --config docs/.rumdl.toml AGENTS.md docs/development/sushy_bmc_emulator.md helm-prereqs/README.md
      - name: Check Fern Markdown
        run: fern docs md check
      - name: Check Fern configuration
        run: fern check
      - name: Check setup script syntax
        run: bash -n helm-prereqs/setup.sh
