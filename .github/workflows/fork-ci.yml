# Personal pre-check CI for TechWizard9999's fork. Never part of an upstream PR:
# it lives only on `ci/**` branches (feature branch + this one commit).
#
# Mirrors the upstream ci.yaml jobs that can run on GitHub's free runners:
#   - format : `cargo make check-format-nightly` equivalent
#   - lint   : lint-police (clippy-flow, carbide-lints, error messages, licenses, bans)
#   - test   : test-release-container-services (`cargo make test-release-container-services`)
#   - docs   : AGENTS.md documentation checks (rumdl on AGENTS.md + changed Markdown,
#              `fern docs md check`, `fern check`), which cannot run on the Windows laptop
# lint and test run inside the project's own build container, built from
# dev/docker/Dockerfile.build-container-x86_64 (public base image), with the
# same PostgreSQL setup as upstream CI. Upstream-only jobs (image builds,
# release artifacts, Kubernetes, helm) are not reproduced.
name: fork-ci

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_NIGHTLY: nightly-2026-06-16
  BUILD_IMAGE: nico-build:local

jobs:
  format:
    if: github.repository != 'dsx-ai-factory/infra-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned nightly rustfmt
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal -c rustfmt
      - name: Check Rust formatting (nightly, as upstream)
        run: cargo +"$RUST_NIGHTLY" fmt --all -- --check

  proto:
    if: github.repository != 'dsx-ai-factory/infra-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: rest-api/go.sum
      - name: Regenerate merged Core protobuf
        run: |
          set -euo pipefail
          generated=rest-api/proto/core/gen/v1/nico_nico.pb.go
          make -C rest-api core-proto
          git diff --check
          test "$(git diff --name-only)" = "$generated"
          test -z "$(git ls-files --others --exclude-standard)"
          mkdir -p "$RUNNER_TEMP/proto-sync"
          git diff --binary -- "$generated" > "$RUNNER_TEMP/proto-sync/proto-sync.patch"
          cp "$generated" "$RUNNER_TEMP/proto-sync/nico_nico.pb.go"
          sha256sum "$generated"
          git add -- "$generated"
      - name: Verify a second sync is clean
        run: |
          make -C rest-api core-proto
          bash scripts/check-repo-clean.sh "REST Core protobuf sync"
      - name: Test REST protobuf packages
        run: make -C rest-api test-proto
      - uses: actions/upload-artifact@v4
        with:
          name: power-shelf-protobuf
          path: ${{ runner.temp }}/proto-sync/
          if-no-files-found: error

  helm:
    if: github.repository != 'dsx-ai-factory/infra-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.0
        with:
          version: 'v4.2.0'
      - name: Install pinned public unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2 --verify=false
      - name: Test the Core chart
        run: helm unittest helm/charts/nico-api

  # AGENTS.md "Documentation review": rumdl on AGENTS.md and every changed Markdown file
  # (fail on every finding), then the Fern CLI pinned in fern/fern.config.json, installed the
  # same way as upstream fern-docs-ci.yml. Rendered review stays manual (Fern preview / GitHub).
  docs:
    if: github.repository != 'dsx-ai-factory/infra-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install rumdl and the pinned Fern CLI
        run: |
          set -euo pipefail
          pipx install rumdl || cargo install rumdl --locked
          rumdl --version
          npm install -g fern-api@$(node -e "console.log(require('./fern/fern.config.json').version)")
          fern --version
      - name: Markdown lint (rumdl) on AGENTS.md and changed Markdown
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags https://github.com/dsx-ai-factory/infra-controller.git main
          base=$(git merge-base FETCH_HEAD HEAD)
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$base" HEAD -- '*.md' | grep -vx 'AGENTS.md' || true)
          echo "rumdl: AGENTS.md ${changed[*]}"
          rumdl check --config docs/.rumdl.toml AGENTS.md "${changed[@]}"
      - name: Fern docs Markdown check
        if: success() || failure()
        run: fern docs md check
      - name: Fern check
        if: success() || failure()
        run: fern check

  lint:
    if: github.repository != 'dsx-ai-factory/infra-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the project's build container
        uses: docker/build-push-action@v6
        with:
          context: dev/docker
          file: dev/docker/Dockerfile.build-container-x86_64
          build-args: KEA_VERSION=2.2.0-6
          tags: ${{ env.BUILD_IMAGE }}
          load: true
          cache-from: type=gha,scope=build-container-x86_64
          cache-to: type=gha,mode=max,scope=build-container-x86_64
      - name: Start build container with PostgreSQL (as upstream CI)
        run: |
          docker run -d --name nico \
            -v "$GITHUB_WORKSPACE:/carbide" -w /carbide \
            -e CARGO_HOME=/carbide/cargo \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_MAKE_SKIP_CODECOV=true \
            -e DATABASE_URL='postgresql://root@%2Fvar%2Frun%2Fpostgresql/root' \
            "$BUILD_IMAGE" sleep infinity
          docker exec nico bash -c '
            set -euo pipefail
            git config --global --add safe.directory /carbide
            printf "max_connections = 1000\nfsync = off\nsynchronous_commit = off\nfull_page_writes = off\n" | tee -a /etc/postgresql/*/main/postgresql.conf
            /etc/init.d/postgresql start
            sudo -u postgres psql -c "ALTER USER root WITH SUPERUSER;"
            createdb root
          '
      - name: Validate Cargo metadata
        run: docker exec nico cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Clippy (cargo make clippy-flow)
        run: docker exec nico cargo make --no-workspace clippy-flow
      - name: Carbide custom lints
        if: success() || failure()
        run: docker exec nico cargo make carbide-lints
      - name: Error message style
        if: success() || failure()
        run: docker exec nico cargo make lint-error-messages
      - name: Licenses
        if: success() || failure()
        run: docker exec nico cargo make --no-workspace check-licenses
      - name: Bans
        if: success() || failure()
        run: docker exec nico cargo make --no-workspace check-bans
      - name: Disk usage
        if: always()
        run: df -h /

  test:
    if: github.repository != 'dsx-ai-factory/infra-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: `git describe --first-parent` must reach a release tag.
          fetch-depth: 0
      # The fork has no tags, so a plain `git describe` returns a bare commit hash,
      # which NICo rejects as a build version ("Invalid server version, cannot check
      # for upgrade" in the dpu_agent_upgrade tests). Fetch upstream's public tags and
      # compute VERSION / CI_COMMIT_SHORT_SHA the way upstream ci.yaml "Calculate version" does.
      - name: Calculate version (as upstream)
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags https://github.com/dsx-ai-factory/infra-controller.git '+refs/tags/*:refs/tags/*'
          VERSION=$(git describe --tags --first-parent --always)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "::error::git describe returned '$VERSION' (no release tag reachable); tests would fail on the build version"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CI_COMMIT_SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION CI_COMMIT_SHORT_SHA=$SHORT_SHA"
      # Test scope. Default (`git ci-test`, branch ci/<name>): FOCUSED — only the Cargo packages
      # that own a file changed against upstream main. `git ci-test full` (branch ci/full/<name>),
      # manual runs, and changes to workspace-wide files (Cargo.toml, Cargo.lock,
      # rust-toolchain.toml, .cargo/, shared test crates) run the FULL suite. No Rust package
      # changed -> tests are skipped. The lint job still compiles and lints the whole workspace.
      - name: Select test scope
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/heads/ci/full/* ]]; then
            scope=FULL
          else
            git fetch --quiet --no-tags https://github.com/dsx-ai-factory/infra-controller.git main
            base=$(git merge-base FETCH_HEAD HEAD)
            mapfile -t files < <(git diff --name-only "$base" HEAD -- . ':!.github/workflows/fork-ci.yml')
            echo "Changed files against upstream main (${#files[@]}):"; printf '  %s\n' "${files[@]}"
            scope=""
            pkgs=()
            for f in "${files[@]}"; do
              case "$f" in
                Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|crates/test-support/*|crates/sqlx-testing/*)
                  scope=FULL; break ;;
              esac
              dir=$(dirname "$f")
              while [ "$dir" != "." ] && [ ! -f "$dir/Cargo.toml" ]; do dir=$(dirname "$dir"); done
              [ "$dir" = "." ] && continue
              name=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^name[ \t]*=/{gsub(/.*=[ \t]*"|".*/,""); print; exit}' "$dir/Cargo.toml")
              [ -n "$name" ] && pkgs+=("$name")
            done
            if [ -z "$scope" ]; then
              if [ ${#pkgs[@]} -eq 0 ]; then scope=NONE; else scope=$(printf '%s\n' "${pkgs[@]}" | sort -u | tr '\n' ' '); fi
            fi
          fi
          echo "TEST_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "::notice::Test scope: $scope"
      - uses: docker/setup-buildx-action@v3
      - name: Build the project's build container
        uses: docker/build-push-action@v6
        with:
          context: dev/docker
          file: dev/docker/Dockerfile.build-container-x86_64
          build-args: KEA_VERSION=2.2.0-6
          tags: ${{ env.BUILD_IMAGE }}
          load: true
          # Read-only here: only the lint job saves the container layers, so the 10 GB
          # Actions cache holds one copy of them next to the sccache entry.
          cache-from: type=gha,scope=build-container-x86_64
      # Compile cache, as upstream: sccache in the build container, stored in the Actions cache.
      # The key follows Cargo.lock, so dependency builds (most of the compile time) are reused
      # until dependencies change; it is saved only when that key is new.
      - name: Restore sccache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-fork-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-fork-test-
      # Same container settings as upstream's "Run release-container service tests"
      # (ulimit, NICO_TEST_MAX_PG_CONNECTIONS, .github/ci/postgresql.conf, VERSION,
      # CI_COMMIT_SHORT_SHA, CONTAINER_REPO_ROOT), plus the variables `cargo make`
      # exports from Makefile.toml [env] (REPO_ROOT, KEA_VERSION, CARBIDE_ENVIRONMENT,
      # FORGE_CA, FORGE_CA_PATH), because the tests run with plain `cargo test` here.
      # Without REPO_ROOT, nvue-client fails and some integration helpers silently skip.
      # RUST_TEST_THREADS: the repo's .cargo/config.toml asks for 60 parallel tests,
      # sized for upstream's 32-core runners; a free runner has 4 cores, so use 8.
      # An environment variable wins over a non-forced [env] entry, so the repo is
      # not changed.
      - name: Start build container with PostgreSQL (as upstream CI)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.sccache"
          docker run -d --name nico \
            --ulimit nofile=65536:65536 \
            -v "$GITHUB_WORKSPACE:/carbide" -w /carbide \
            -v "$GITHUB_WORKSPACE/.sccache:/sccache" \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=3G \
            -e RUSTC_WRAPPER=sccache \
            -e CARGO_HOME=/carbide/cargo \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_MAKE_SKIP_CODECOV=true \
            -e DATABASE_URL='postgresql://root@%2Fvar%2Frun%2Fpostgresql/root' \
            -e NICO_TEST_MAX_PG_CONNECTIONS=900 \
            -e RUST_TEST_THREADS=8 \
            -e VERSION="$VERSION" \
            -e CI_COMMIT_SHORT_SHA="$CI_COMMIT_SHORT_SHA" \
            -e CONTAINER_REPO_ROOT=/carbide \
            -e REPO_ROOT=/carbide \
            -e KEA_VERSION="$(cat dev/docker/kea.version)" \
            -e CARBIDE_ENVIRONMENT=local \
            -e FORGE_CA=nonprod \
            -e FORGE_CA_PATH=/carbide/dev/forge_nonprodroot.pem \
            "$BUILD_IMAGE" sleep infinity
          docker exec nico bash -c '
            set -euo pipefail
            echo "Open file descriptor limits: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
            git config --global --add safe.directory /carbide
            if [ -f .github/ci/postgresql.conf ]; then
              tee -a /etc/postgresql/*/main/postgresql.conf < .github/ci/postgresql.conf
            else
              printf "fsync = off\nsynchronous_commit = off\nfull_page_writes = off\nmax_connections = 1000\n" | tee -a /etc/postgresql/*/main/postgresql.conf
            fi
            /etc/init.d/postgresql start
            sudo -u postgres psql -c "ALTER USER root WITH SUPERUSER;"
            createdb root
            sudo -u postgres psql -c "CREATE ROLE nico_ipv6_test LOGIN PASSWORD \$\$nico_ipv6_test\$\$;"
          '
      # Same commands as `cargo make test-release-container-services`, plus:
      #  - --no-fail-fast, so every test program runs even if one has a failure;
      #  - every failed test is rerun alone (--test-threads=1):
      #      * fails again                          -> real failure, job fails
      #      * a failing program reran 0 tests      -> it crashed / failed for another reason, job fails
      #      * passes alone, and is a KNOWN timing test -> warning only (job not fully green)
      #      * passes alone, but is NOT a known timing test -> job fails (possible race between tests)
      - name: Unit and database tests (test-release-container-services, with rerun of failures)
        env:
          KNOWN_TIMING_TESTS: >-
            tests::component_power_details::blocked_snapshots_release_pool_capacity
            tests::resource_pool_inspection::polling_retains_samples_after_database_failure_and_cancels_sql
        run: |
          docker exec \
            -e NICO_TEST_POSTGRES_URL='postgresql://nico_ipv6_test:nico_ipv6_test@[::1]:5432/postgres?sslmode=disable' \
            -e NICO_TEST_TEMPLATE_DB=sqlx_ci_template_db \
            -e KNOWN_TIMING_TESTS="$KNOWN_TIMING_TESTS" \
            -e TEST_SCOPE="$TEST_SCOPE" \
            nico bash -c '
              set -uo pipefail
              echo "RUST_TEST_THREADS=${RUST_TEST_THREADS:-unset} NICO_TEST_MAX_PG_CONNECTIONS=${NICO_TEST_MAX_PG_CONNECTIONS:-unset}"
              echo "VERSION=${VERSION:-unset} CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA:-unset} REPO_ROOT=${REPO_ROOT:-unset} CONTAINER_REPO_ROOT=${CONTAINER_REPO_ROOT:-unset}"
              [ -n "${VERSION:-}" ] && [ -n "${REPO_ROOT:-}" ] || { echo "REAL FAILURE: VERSION or REPO_ROOT missing in the test container (fork CI setup error)."; exit 1; }
              case "$TEST_SCOPE" in
                NONE) echo "SCOPE: no Rust package changed; tests skipped."; echo "ALL TESTS PASSED on the first pass (no Rust tests needed)."; exit 0 ;;
                FULL) echo "SCOPE: FULL workspace"; scope_args="" ;;
                *) scope_args=$(for p in $TEST_SCOPE; do printf -- "-p %s " "$p"; done)
                   echo "SCOPE: FOCUSED on changed packages: $TEST_SCOPE (run git ci-test full for the whole suite)" ;;
              esac
              # shellcheck disable=SC2086
              cargo test --profile=ci-tests --no-run $scope_args || exit 1
              # Package-scoped tests do not build workspace-only binary targets.
              # Core TLS integration tests launch this helper beside the test profile.
              cargo build --profile=ci-tests -p carbide-libmlx --bin mlx-firmware-supervisor || exit 1
              if [ ! -x target/ci-tests/prepare-test-template ]; then
                cargo build --profile=ci-tests -p carbide-sqlx-testing --bin prepare-test-template || exit 1
              fi
              target/ci-tests/prepare-test-template || exit 1
              # shellcheck disable=SC2086
              cargo test --profile=ci-tests --no-fail-fast $scope_args 2>&1 | tee /tmp/tests.log
              first=${PIPESTATUS[0]}
              grep -aE "^test result:" /tmp/tests.log | awk "{p+=\$4; f+=\$6; i+=\$8} END {print \"FIRST PASS: \" p \" passed, \" f \" failed, \" i \" ignored\"}"
              [ "$first" -eq 0 ] && { echo "ALL TESTS PASSED on the first pass."; exit 0; }

              names=$(grep -aE "^test .* \.\.\. FAILED$" /tmp/tests.log | sed -E "s/^test (.*) \.\.\. FAILED$/\1/" | sort -u)
              # Failing test programs: cargo prints "to rerun pass `X`" for one, and a
              # "N targets failed:" list of `X` lines for several (--no-fail-fast).
              targets=$( { grep -aoE "to rerun pass \`[^\`]+\`" /tmp/tests.log | sed -E "s/^to rerun pass \`(.*)\`$/\1/"; sed -n "/targets\? failed:/,\$p" /tmp/tests.log | grep -aE "^[[:space:]]+\`-p [^\`]+\`[[:space:]]*$" | sed -E "s/^[[:space:]]+\`(.*)\`[[:space:]]*$/\1/"; } | sort -u)
              [ -n "$targets" ] || { echo "REAL FAILURE: tests failed but cargo named no failing test program (build or harness error)."; exit 1; }
              [ -n "$names" ] || { echo "REAL FAILURE: failing test program(s) printed no failed test (crash or harness error):"; printf "  %s\n" "$targets"; exit 1; }
              echo "Failed on the first pass:"; printf "  %s\n" $names

              real=0
              while IFS= read -r t; do
                [ -n "$t" ] || continue
                echo "::group::Rerun alone: $t"
                # shellcheck disable=SC2086
                cargo test --profile=ci-tests $t -- --exact $names --test-threads=1 > /tmp/r.log 2>&1; rc=$?
                cat /tmp/r.log; cat /tmp/r.log >> /tmp/rerun.log
                echo "::endgroup::"
                ran=$(grep -aE "^test result:" /tmp/r.log | awk "{n+=\$4+\$6} END {print n+0}")
                if [ "$rc" -ne 0 ]; then
                  echo "REAL FAILURE in $t: failed again when run alone."; real=1
                elif [ "$ran" -eq 0 ]; then
                  echo "REAL FAILURE in $t: it failed in the first pass, but none of the failed tests belong to it (crash or harness error)."; real=1
                fi
              done <<EOF
          $targets
          EOF
              if [ "$real" -ne 0 ]; then
                grep -aE "^test .* \.\.\. FAILED$" /tmp/rerun.log | sort -u
                exit 1
              fi

              unknown=""
              for n in $names; do
                case " $KNOWN_TIMING_TESTS " in *" $n "*) ;; *) unknown="$unknown $n" ;; esac
              done
              if [ -n "$unknown" ]; then
                echo "REAL FAILURE: these failed under parallel load and passed alone, but are NOT known timing tests (possible race between tests):"
                printf "  %s\n" $unknown
                exit 1
              fi
              echo "NOT FULLY GREEN: only known timing tests failed under load and passed alone:"; printf "  %s\n" $names
              echo "::warning::Not fully green: known timing tests failed under parallel load and passed alone: $(echo $names | tr "\n" " ")"
            '
      # Everything in the container runs as root; hand the cache back to the runner user so
      # actions/cache can read it, then save it only when the Cargo.lock key is new.
      - name: Hand sccache back to the runner
        if: always()
        run: |
          docker exec nico bash -c "sccache --show-stats || true; du -sh /sccache || true; chown -R $(id -u):$(id -g) /sccache" || true
      - name: Save sccache
        if: always() && steps.sccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sccache
          key: sccache-fork-test-${{ hashFiles('Cargo.lock') }}
      - name: Disk usage
        if: always()
        run: df -h /
