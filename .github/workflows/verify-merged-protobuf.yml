name: verify-merged-protobuf
on:
  push:
    branches: ['ci/8072-proto-sync-20261110']
permissions:
  contents: read
jobs:
  protobuf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: rest-api/go.sum
      - name: Regenerate from the merged Core schema
        run: |
          set -euo pipefail
          generated=rest-api/proto/core/gen/v1/nico_nico.pb.go
          make -C rest-api core-proto
          git diff --check
          test "$(git diff --name-only)" = "$generated"
          test -z "$(git ls-files --others --exclude-standard)"
          mkdir -p "$RUNNER_TEMP/proto-sync"
          git diff --binary -- "$generated" > "$RUNNER_TEMP/proto-sync/proto-sync.patch"
          cp "$generated" "$RUNNER_TEMP/proto-sync/nico_nico.pb.go"
          sha256sum "$generated"
          git add -- "$generated"
      - name: Check that a second sync leaves no diff
        run: |
          make -C rest-api core-proto
          bash scripts/check-repo-clean.sh "REST Core protobuf sync"
      - name: Test REST protobuf packages
        run: make -C rest-api test-proto
      - uses: actions/upload-artifact@v4
        with:
          name: merged-protobuf-output
          path: ${{ runner.temp }}/proto-sync/
          if-no-files-found: error
